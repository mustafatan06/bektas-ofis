<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli | Bektaş Ofis Mobilyaları</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-red: #d32f2f; --dark-gray: #212529; --light-gray: #f8f9fa; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-gray); color: var(--dark-gray); padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; background: var(--white); padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .admin-header h1 { font-size: 20px; color: var(--dark-gray); }
        .admin-header a { text-decoration: none; background: var(--dark-gray); color: white; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        #form-submit-btn { width: 100%; background-color: var(--primary-red); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        #form-submit-btn:hover { background-color: #b71c1c; }
        .admin-product-item { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .admin-buttons { display: flex; gap: 6px; }
        .btn-delete { background-color: var(--primary-red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-edit { background-color: #37474f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-sliders"></i> Bulut Ürün Yönetim Paneli</h1>
            <a href="index.html"><i class="fa-solid fa-globe"></i> Siteye Git</a>
        </div>

        <form id="product-form">
            <input type="hidden" id="p-edit-id" value="">
            <div class="form-group">
                <label>Ürün Adı:</label>
                <input type="text" id="p-name" required placeholder="Örn: Lüks Yönetici Takımı">
            </div>
            <div class="form-group">
                <label>Fiyat (₺):</label>
                <input type="text" id="p-price" required placeholder="Örn: 15.000 ₺">
            </div>
            <div class="form-group">
                <label>Açıklama:</label>
                <textarea id="p-desc" rows="2" required placeholder="Özellikler..."></textarea>
            </div>
            <div class="form-group">
                <label>Görsel Linkleri (Virgülle ayırarak https://...):</label>
                <input type="text" id="p-image-urls" required placeholder="https://resim1.jpg, https://resim2.jpg">
                <small style="color:#666;">Bulut sisteminde görsellerin kalıcı olması için doğrudan resim URL'si girilmelidir.</small>
            </div>
            <button type="submit" id="form-submit-btn">Yeni Ürün Ekle</button>
        </form>

        <div style="margin-top: 35px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;">Mevcut Ürünleri Düzenle / Sil</h3>
            <div id="admin-product-list" style="max-height: 250px; overflow-y: auto;">Yükleniyor...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnCrsvbGYUrFPrLWVo414LJWgPnQpsc",
            authDomain: "bektas-ofis.firebaseapp.com",
            projectId: "bektas-ofis",
            storageBucket: "bektas-ofis.firebasestorage.app",
            messagingSenderId: "864491043655",
            appId: "1:864491043655:web:c6424de1867523f579aa62",
            measurementId: "G-QNCT1K3ZK5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let productsList = [];

        async function fetchProducts() {
            const listEl = document.getElementById('admin-product-list');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productsList = [];
                querySnapshot.forEach((d) => {
                    productsList.push({ id: d.id, ...d.data() });
                });

                if(productsList.length === 0) {
                    listEl.innerHTML = "<p>Kayıtlı ürün bulunmuyor.</p>";
                    return;
                }

                listEl.innerHTML = productsList.map(p => {
                    let thumb = p.images && p.images.length > 0 ? p.images[0] : "";
                    return `
                        <div class="admin-product-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${thumb}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
                                <div>
                                    <strong style="font-size:14px;">${p.name}</strong><br>
                                    <span style="color:var(--primary-red); font-size:13px; font-weight:bold;">${p.price}</span>
                                </div>
                            </div>
                            <div class="admin-buttons">
                                <button class="btn-edit" onclick="window.editItem('${p.id}')">Düzenle</button>
                                <button class="btn-delete" onclick="window.deleteItem('${p.id}')">Sil</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                listEl.innerHTML = "<p style='color:red;'>Bağlantı hatası!</p>";
            }
        }

        window.editItem = function(id) {
            const p = productsList.find(item => item.id === id);
            if(p) {
                document.getElementById('p-edit-id').value = p.id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-desc').value = p.desc;
                document.getElementById('p-image-urls').value = p.images ? p.images.join(', ') : '';
                document.getElementById('form-submit-btn').innerText = "Ürünü Güncelle";
                document.getElementById('form-submit-btn').style.background = "#37474f";
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        };

        window.deleteItem = function(id) {
            if(confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                deleteDoc(doc(db, "products", id)).then(() => {
                    alert("Ürün silindi!");
                    fetchProducts();
                });
            }
        };

        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const editId = document.getElementById('p-edit-id').value;
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const images = document.getElementById('p-image-urls').value.split(',').map(s => s.trim()).filter(s => s);

            try {
                if(editId) {
                    await updateDoc(doc(db, "products", editId), { name, price, desc, images });
                    alert("Ürün güncellendi!");
                } else {
                    await addDoc(collection(db, "products"), { name, price, desc, images });
                    alert("Yeni ürün eklendi!");
                }
                document.getElementById('product-form').reset();
                document.getElementById('p-edit-id').value = "";
                document.getElementById('form-submit-btn').innerText = "Yeni Ürün Ekle";
                document.getElementById('form-submit-btn').style.background = "var(--primary-red)";
                fetchProducts();
            } catch(err) {
                alert("İşlem başarısız oldu!");
            }
        });

        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
